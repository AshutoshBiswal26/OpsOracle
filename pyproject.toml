[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsoracle"
version = "0.1.0"
description = "Evidence-first, AI-assisted AWS incident investigation"
requires-python = ">=3.11"
dependencies = ["boto3>=1.38,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
